<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  try {
    var wsTheme = localStorage.getItem("ws-theme");
    if (wsTheme === "light" || wsTheme === "dark") {
      var wsMeta = document.querySelector('meta[name="color-scheme"]');
      if (wsMeta) { wsMeta.setAttribute("content", wsTheme); }
    }
  } catch (e) {}
</script>
<meta name="ws-loopback-token" content="">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">
<title>일검풍운결 세이브 에디터 v1.0</title>
<style>
  * { box-sizing: border-box; }

  html,
  body { margin: 0; padding: 0; }

  :root { color-scheme: light dark; }

  :root:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }

  :root:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }

  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --surface-alt: #e9ecf2;
    --border: #d2d7e0;
    --text: #1b1e26;
    --muted: #59606e;
    --accent: #2f6fed;
    --accent-soft: #dbe6ff;
    --danger: #b83b2f;
    --ok: #1f8a5b;
    --radius: 10px;
    --shadow: 0 16px 40px rgba(20, 24, 33, 0.22);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101218;
      --surface: #181b23;
      --surface-alt: #21252f;
      --border: #333947;
      --text: #e8eaf0;
      --muted: #a3a9b8;
      --accent: #7ea6ff;
      --accent-soft: #23304d;
      --danger: #ff8a7c;
      --ok: #62d6a2;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
  }

  @supports (color: light-dark(white, black)) {
    :root {
      --bg: light-dark(#f3f4f7, #101218);
      --surface: light-dark(#ffffff, #181b23);
      --surface-alt: light-dark(#e9ecf2, #21252f);
      --border: light-dark(#d2d7e0, #333947);
      --text: light-dark(#1b1e26, #e8eaf0);
      --muted: light-dark(#59606e, #a3a9b8);
      --accent: light-dark(#2f6fed, #7ea6ff);
      --accent-soft: light-dark(#dbe6ff, #23304d);
      --danger: light-dark(#b83b2f, #ff8a7c);
      --ok: light-dark(#1f8a5b, #62d6a2);
    }
  }

  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-inline-size: 1180px;
    margin: 0 auto;
    padding: 18px 18px 48px;
  }

  .top-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .top-bar h1 {
    margin: 0;
    font-size: 1.22rem;
    letter-spacing: -0.01em;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--muted);
    font-size: 0.78rem;
    white-space: nowrap;
  }

  .badge-ok { color: var(--ok); border-color: var(--ok); }
  .badge-danger, .badge.is-dirty, .badge.is-error { color: var(--danger); border-color: var(--danger); }

  .theme-control {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.86rem;
  }

  .theme-control select,
  .server-bar select,
  .field-row select,
  .field-row input,
  .toolbar-row select,
  .toolbar-row input,
  .dialog-body input,
  .table-wrapper input {
    font: inherit;
    color: var(--text);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
  }

  .server-bar select { min-inline-size: 200px; }

  .status-banner {
    margin-block: 12px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-inline-start: 4px solid var(--accent);
    border-radius: 8px;
    background: var(--surface);
    color: var(--muted);
    font-size: 0.9rem;
  }

  .status-banner.is-error {
    border-inline-start-color: var(--danger);
    color: var(--danger);
  }

  .file-actions,
  .server-bar,
  .preset-bar,
  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-block: 10px;
  }

  .server-bar[hidden] { display: none !important; }

  .btn {
    font: inherit;
    font-size: 0.88rem;
    padding: 7px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  .btn:hover { background: var(--surface-alt); }
  .btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    color: light-dark(#ffffff, #0b1220);
  }

  .btn-danger {
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-primary:hover { filter: brightness(1.06); }

  .preset-label {
    color: var(--muted);
    font-size: 0.84rem;
    font-weight: 600;
  }

  .preset-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tab-bar {
    display: flex;
    gap: 2px;
    margin-block: 18px 0;
    border-block-end: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
  }

  .tab-bar [role="tab"] {
    font: inherit;
    font-size: 0.92rem;
    padding: 10px 14px;
    border: 1px solid transparent;
    border-block-end: 0;
    border-start-start-radius: 9px;
    border-start-end-radius: 9px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }

  .tab-bar [role="tab"]:hover { color: var(--text); background: var(--surface-alt); }
  .tab-bar [role="tab"]:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: -2px; }

  [role="tab"][aria-selected="true"] { position: relative; }

  [role="tab"][aria-selected="true"]::after {
    content: "";
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    border-block-end: 3px solid var(--accent);
  }

  .tab-bar [role="tab"][aria-selected="true"] {
    color: var(--text);
    background: var(--surface);
    border-color: var(--border);
    border-block-end-color: transparent;
  }

  .panel { margin-block-start: -1px; }

  .panel-body {
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
  }

  .panel-body h2 {
    margin: 0 0 12px;
    font-size: 1.04rem;
  }

  .panel-body h3 {
    margin: 18px 0 10px;
    font-size: 0.96rem;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat-card {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface-alt);
  }

  .stat-card .label {
    display: block;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .stat-card .value {
    display: block;
    margin-top: 4px;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .field-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }

  .field-row label {
    font-size: 0.83rem;
    font-weight: 600;
    color: var(--muted);
  }

  .dynamic-root:empty::before {
    content: "세이브를 불러오면 이 영역에 편집 항목이 표시됩니다.";
    display: block;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.88rem;
    text-align: center;
  }

  .notice-box {
    margin: 0 0 14px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-inline-start: 4px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--text);
    font-size: 0.9rem;
  }

  .notice-box strong { color: var(--accent); }

  .table-wrapper {
    container-type: inline-size;
    overflow: auto;
    max-block-size: 520px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 10px;
  }

  .table-wrapper:focus-visible {
    outline: 3px solid var(--accent-soft);
    outline-offset: 2px;
  }

  .table-wrapper table {
    inline-size: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  .table-wrapper caption {
    padding: 10px 12px;
    text-align: start;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface);
  }

  .table-wrapper thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--surface-alt);
    color: var(--muted);
    text-align: start;
    font-weight: 600;
    padding: 9px 12px;
    border-block-end: 1px solid var(--border);
  }

  .table-wrapper tbody th,
  .table-wrapper tbody td {
    padding: 8px 12px;
    border-block-end: 1px solid var(--border);
    text-align: start;
    vertical-align: middle;
  }

  .table-wrapper tbody th {
    font-weight: 600;
    color: var(--text);
    background: var(--surface-alt);
  }

  .table-wrapper tbody tr:last-child th,
  .table-wrapper tbody tr:last-child td { border-block-end: 0; }

  @container (width < 600px) {
    .table-wrapper thead { display: none; }

    .table-wrapper tbody tr {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 10px 12px;
      border-block-end: 1px solid var(--border);
    }

    .table-wrapper tbody th,
    .table-wrapper tbody td {
      display: block;
      padding: 2px 0;
      border: 0;
      background: transparent;
    }

    .table-wrapper tbody th::before,
    .table-wrapper tbody td::before {
      content: attr(data-label) ": ";
      font-weight: 600;
      color: var(--muted);
    }
  }

  dialog {
    margin: auto;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    max-inline-size: min(92vw, 540px);
    inline-size: 100%;
    box-shadow: var(--shadow);
  }

  dialog[open] { display: block; }

  dialog:modal { overscroll-behavior: contain; }

  dialog::backdrop {
    background: rgba(0, 0, 0, 0.55);
    overflow: hidden;
    overscroll-behavior: contain;
  }

  .dialog-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 20px 22px;
  }

  .dialog-body h2 {
    margin: 0 0 4px;
    font-size: 1.02rem;
  }

  .dialog-text {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }

  .picker-list {
    list-style: none;
    margin: 4px 0 0;
    padding: 4px;
    max-block-size: 280px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .picker-item {
    display: block;
    inline-size: 100%;
    text-align: start;
    font: inherit;
    font-size: 0.87rem;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  .picker-item:hover { background: var(--surface-alt); }
  .picker-item.is-selected {
    background: var(--accent-soft);
    border-color: var(--accent);
    font-weight: 600;
  }

  .picker-list:empty::before {
    content: "선택할 수 있는 항목이 없습니다.";
    display: block;
    padding: 14px;
    color: var(--muted);
    font-size: 0.88rem;
    text-align: center;
  }

  .code-atlas-box {
    margin-top: 18px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-alt);
    color: var(--text);
    font-size: 0.88rem;
    overflow-wrap: anywhere;
  }

  .code-atlas-box h3 {
    margin: 0 0 10px;
    font-size: 1rem;
  }

  .code-atlas-box h4 {
    margin: 14px 0 6px;
    font-size: 0.9rem;
    color: var(--accent);
  }

  .code-atlas-box code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.82rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }

  .atlas-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0 10px;
  }

  .atlas-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    font-size: 0.8rem;
  }

  .atlas-note {
    margin: 4px 0 8px;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top-bar">
    <div class="brand">
      <h1>일검풍운결 세이브 에디터 v1.0</h1>
      <div class="badges">
        <span id="mode-badge" class="badge">오프라인 브라우저 모드</span>
        <span id="dirty-badge" class="badge">비어 있음</span>
        <span id="valid-badge" class="badge">검증 대기</span>
      </div>
    </div>
    <label class="theme-control" for="theme-select">
      <span>화면 테마</span>
      <select id="theme-select">
        <option value="system">시스템 설정</option>
        <option value="light">밝은 화면</option>
        <option value="dark">어두운 화면</option>
      </select>
    </label>
  </header>

  <div id="status-banner" class="status-banner" role="status" aria-live="polite">
    세이브 파일을 열거나 체험판 세이브를 불러오세요.
  </div>

  <section class="file-actions" aria-label="파일 작업">
    <input id="file-input" type="file" accept=".sav" hidden>
    <button id="btn-browser-open" type="button" class="btn btn-primary">세이브 파일 열기</button>
    <button id="btn-load-demo" type="button" class="btn">체험판 세이브 불러오기</button>
    <button id="btn-browser-download" type="button" class="btn">수정본 다운로드 (.sav)</button>
  </section>

  <section id="loopback-bar" class="server-bar" aria-label="로컬 서버 연결" hidden>
    <select id="loopback-file-select" aria-label="서버 세이브 목록"></select>
    <button id="btn-loopback-open" type="button" class="btn">선택 파일 열기</button>
    <button id="btn-loopback-save" type="button" class="btn btn-primary">원본 백업 후 저장</button>
  </section>

  <section id="native-bar" class="server-bar" aria-label="데스크톱 앱 연결" hidden>
    <button id="btn-native-open" type="button" class="btn">세이브 열기</button>
    <button id="btn-native-save" type="button" class="btn btn-primary">저장 (자동 백업)</button>
    <button id="btn-native-save-copy" type="button" class="btn">다른 이름으로 저장</button>
  </section>

  <div id="preset-bar" class="preset-bar" role="group" aria-label="빠른 프리셋">
    <span class="preset-label">빠른 프리셋</span>
    <div id="preset-buttons" class="preset-buttons"></div>
  </div>

  <div role="tablist" aria-label="편집 분류" class="tab-bar">
    <button type="button" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" tabindex="0">개요·전역</button>
    <button type="button" role="tab" id="tab-stats" aria-controls="panel-stats" aria-selected="false" tabindex="-1">인물·능력치</button>
    <button type="button" role="tab" id="tab-martial" aria-controls="panel-martial" aria-selected="false" tabindex="-1">무공·경맥</button>
    <button type="button" role="tab" id="tab-bag" aria-controls="panel-bag" aria-selected="false" tabindex="-1">가방 물품</button>
    <button type="button" role="tab" id="tab-companions" aria-controls="panel-companions" aria-selected="false" tabindex="-1">동료·문파</button>
    <button type="button" role="tab" id="tab-world" aria-controls="panel-world" aria-selected="false" tabindex="-1">탈것·도안·전승</button>
  </div>

  <main>
    <section role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" class="panel">
      <div class="panel-body">
        <h2>개요·전역</h2>
        <div id="overview-root" class="dynamic-root"></div>
        <section id="editorCodeAtlasBox" class="code-atlas-box" aria-label="REA 코드·수식 아틀라스"></section>
      </div>
    </section>

    <section role="tabpanel" id="panel-stats" aria-labelledby="tab-stats" class="panel" hidden="until-found">
      <div class="panel-body">
        <h2>인물·능력치</h2>
        <div id="stats-root" class="dynamic-root"></div>
      </div>
    </section>

    <section role="tabpanel" id="panel-martial" aria-labelledby="tab-martial" class="panel" hidden="until-found">
      <div class="panel-body">
        <h2>무공·경맥</h2>
        <div class="notice-box" role="note">
          <strong>안내:</strong> 경맥의 능력치 상승 효과는 인게임 돌파 시점에 합산됩니다. 경맥 점수를 넉넉히 부여한 뒤 게임 내 경맥 화면에서 '일괄 돌파'를 실행하면 누락 없이 모든 내공·기혈 보너스가 정상 반영됩니다.
        </div>
        <div id="martial-root" class="dynamic-root"></div>
      </div>
    </section>

    <section role="tabpanel" id="panel-bag" aria-labelledby="tab-bag" class="panel" hidden="until-found">
      <div class="panel-body">
        <h2>가방 물품</h2>
        <div id="bag-root" class="dynamic-root"></div>
      </div>
    </section>

    <section role="tabpanel" id="panel-companions" aria-labelledby="tab-companions" class="panel" hidden="until-found">
      <div class="panel-body">
        <h2>동료·문파</h2>
        <div id="companions-root" class="dynamic-root"></div>
      </div>
    </section>

    <section role="tabpanel" id="panel-world" aria-labelledby="tab-world" class="panel" hidden="until-found">
      <div class="panel-body">
        <h2>탈것·도안·전승</h2>
        <div id="world-root" class="dynamic-root"></div>
      </div>
    </section>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-dialog-title">
    <div class="dialog-body">
      <h2 id="confirm-dialog-title">작업 확인</h2>
      <p id="confirm-dialog-message" class="dialog-text"></p>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel-btn" class="btn" autofocus>취소</button>
        <button type="button" id="confirm-ok-btn" class="btn btn-primary">확인</button>
      </div>
    </div>
  </dialog>

  <dialog id="picker-dialog" aria-labelledby="picker-dialog-title">
    <div class="dialog-body">
      <h2 id="picker-dialog-title">항목 추가</h2>
      <label for="picker-search-input">이름 또는 번호 검색</label>
      <input id="picker-search-input" type="search" placeholder="예: 일전혈기단, 태극검법, 100">
      <label for="picker-count-input" id="picker-count-label">수량 / 등급</label>
      <input id="picker-count-input" type="number" min="1" max="9999" value="1">

이 맛있고 성격이 온화하여 식용으로도, 관상용으로도 쓰인다. 고소성, 명검산장 등 수역에서 낚시로 얻을 수 있다."],"10530":["쏘가리",3,0,"쏘가리는 성격이 사납고, 살이 맛있고 부드러우며, 살이 많고 가시가 적어 식객들에게 사랑받는다. 도화림, 명검산장 등 수역에서 낚시로 얻을 수 있다."],"10531":["농어",3,0,"농어는 살이 부드럽고, 물을 맑게 하며, 약용 효과도 있어 인기가 많다. 연심호, 백제호 등 수역에서 낚시로 얻을 수 있다."],"10532":["청어",3,0,"청어는 몸이 길고, 가시가 적고 살이 많으며, 살이 부드럽고 자양 효과가 있다. 소절림, 낙영림 등 수역에서 낚시로 얻을 수 있다."],"10533":["청게",3,0,"청게는 몸집이 크고, 살이 맛있으며, 알이 많고 살이 쪄 매우 귀하다. 뇌가촌, 천명촌 등 수역에서 낚시로 얻을 수 있다."],"10534":["메기",3,0,"메기는 성격이 사납고, 살이 부드럽고 맛있으며, 살이 두껍고 가시가 적어 보양 효과도 있다. 천명촌, 백귀동 등 수역에서 낚시로 얻을 수 있다."],"10535":["가물치",3,0,"가물치는 몸집이 크고, 살이 단단하며, 맛이 달고 맛있어 소나 양고기에 뒤지지 않는다. 진리촌, 백귀동 등 수역에서 낚시로 얻을 수 있다."],"10536":["황화어",3,0,"황화어는 맛이 매우 좋고, 살이 부드러우며, 부레는 맛 중의 진미이다. 연심호, 뇌가촌 등 수역에서 낚시로 얻을 수 있다."],"10537":["철갑상어",3,0,"철갑상어는 몸집이 크고, 성장이 매우 빠르며, 살이 단단하고, 몸매가 아름다워 관상용으로도 쓰인다. 천명촌, 이군 등 수역에서 낚시로 얻을 수 있다."],"10538":["비단잉어",3,0,"비단잉어는 비늘이 화려하여 관상용으로 많이 쓰이며, 살이 부드러워 식용으로도 가능하다. 진리촌, 청목방 등 수역에서 낚시로 얻을 수 있다."],"10539":["해삼",3,0,"해삼은 살이 부드럽고, 영양이 풍부하여 팔진 중 하나로 꼽힌다. 뇌가촌, 명검산장 등 수역에서 낚시로 얻을 수 있다."],"10540":["전복",3,0,"전복은 매우 희귀하며, 맛이 좋고 식감이 아삭하고 쫄깃하다. 명검산장, 청목방 등 수역에서 낚시로 얻을 수 있다."],"10541":["은어",3,0,"은어는 맛이 좋고, 몸집이 매우 작아 내장을 제거하지 않고 먹을 수 있으며, 폐를 윤택하게 하고 기침을 멎게 하는 효능이 있다. 단림, 만겁굴 등 수역에서 낚시로"],"10542":["백어",3,0,"백어는 몸집이 크고, 맛이 좋으며, 성질이 사납고, 신장을 보하고 뇌를 이롭게 하는 등 자양 효능이 있다. 유운택, 백약곡 등 수역에서 낚시로 얻을 수 있다."],"10543":["준치",3,0,"준치는 살이 부드럽고 기름지며, 맛이 달고 맛있어 예로부터 공물로 바쳐졌다. 유운택, 일선천 등 수역에서 낚시로 얻을 수 있다."],"10544":["칼치",3,0,"칼치는 몸매가 독특하고, 살이 맛있고 부드러우며, 기름지고 살이 많아 간장을 보양하는 데 도움이 된다. 경롱, 이군 등 수역에서 낚시로 얻을 수 있다."],"10545":["황어",3,0,"황어는 몸집이 크고, 성질이 사나우며, 살이 맛있고, 연골, 알 모두 진미이다. 유운택, 이군 등 수역에서 낚시로 얻을 수 있다."],"10546":["해파리",3,0,"해파리는 식감이 아삭하고 탄력이 있으며, 맛이 신선하고 뒷맛이 달지만, 독이 있을 수 있으니 구별하여 먹어야 한다. 유운택, 신루해역 등 수역에서 낚시로 얻을 수"],"10547":["자색 조개",3,0,"자색 조개는 맛이 매우 좋고, 수가 적어 생으로 먹거나 말려서 탕으로 끓여 먹을 수 있다. 천명촌, 신루해역 등 수역에서 낚시로 얻을 수 있다."],"10548":["칠성장어",3,0,"칠성장어라고도 불리며, 형태가 무섭고, 살이 맛있으며, 자양강장 효능이 있다. 만겁굴, 일선천 등 수역에서 낚시로 얻을 수 있다."],"10549":["참게",3,0,"참게는 살이 부드럽고, 맛이 신선하고 약간 달콤하며, 매우 희귀하다. 연심호, 백약곡 등 수역에서 낚시로 얻을 수 있다."],"10550":["음침목",3,0,"음침목은 질이 매우 단단하여 나무도 아니고 돌도 아니며, 향기가 매우 독특하다. 단림 등 임지 수역에서 낚시로 얻을 수 있다."],"10551":["황금잉어",3,0,"온몸의 비늘이 금빛으로 빛나고, 입에는 네 개의 수염이 있어 마치 용의 수염 같으며, 매우 희귀하다. 진리촌, 백약곡 등 수역에서 낚시로 얻을 수 있다."],"10552":["자라",3,0,"자라는 성질이 사납고 싸움을 좋아하며, 살이 단단하고 자양 효과가 있다. 백귀동, 일선천 등 수역에서 낚시로 얻을 수 있다."],"10553":["얼음잉어",3,0,"설산의 차가운 연못에만 서식하는 특유의 잉어로, 살이 매우 맛있고 부드럽다. 천산 수역에서 낚시로 얻을 수 있다."],"10554":["사새농어",3,0,"일선천에서만 나는 특산 농어로, 일반 농어보다 아가미가 두 개 더 많아 매우 희귀하다. 일선천 수역에서 낚시로 얻을 수 있다."],"10555":["적린어",3,0,"적린어는 맛이 매우 좋고, 특정 환경에서만 살 수 있어 세상에서 귀하게 여겨진다. 신루해역 수역에서 낚시로 얻을 수 있다."],"10556":["용어",3,0,"용어는 몸이 길고, 몸집이 크며, 헤엄치는 용과 같고, 살이 단단하고 부드러워 매우 드물다."],"10557":["설합",3,0,"설합은 살이 부드럽고 맛이 좋으며, 눈 덮인 높은 산에만 분포한다. 천산 수역에서 낚시로 얻을 수 있다."],"10558":["신비한 보물 상자",3,0,"낚시로 얻은 신비한 보물 상자로, 안에 무엇이 들어 있는지 알 수 없다. 연심호, 백제호 등 특별한 수역에서 낚시로 얻을 수 있다."],"10559":["신비한 보물 상자",3,0,"낚시로 얻은 신비한 보물 상자로, 안에 무엇이 들어 있는지 알 수 없다. 만겁굴, 청목방 등 고급 특별 수역에서 낚시로 얻을 수 있다."],"10560":["낡은 신비한 보물 상자",3,0,"낚시로 얻은 신비한 보물 상자로, 안에 무엇이 들어 있는지 알 수 없다."],"10566":["달걀",3,0,"방목하여 기른 토종닭이 낳은 달걀. 평강성, 낙촌 등 마을 상인이 판매할 수 있다."],"10567":["생선 살",3,0,"보통 생선 살로, 매우 신선하다."],"10568":["질 좋은 생선 살",3,0,"질 좋은 생선 살로, 기름기가 풍부하고 식감이 신선하고 부드럽다."],"10569":["최상급 생선 살",3,0,"최상급 품질의 생선 살로, 살이 신선하고 부드러우며 섬세하고, 희고 기름지다."],"10570":["용골",3,0,"알 수 없는 생물의 뼈로, 오랫동안 땅속에 묻혀 있어 효능을 알 수 없다."],"10571":["질 좋은 바닷물고기 살",3,0,"질 좋은 바닷물고기 살로, 해안 마을의 부엌에서 흔히 볼 수 있다."],"10572":["최상급 바닷물고기 살",3,0,"최상급 품질의 바닷물고기 살로, 남녀노소 누구나 먹기 좋다."],"10573":["특별한 바닷물고기 살",3,0,"희귀한 바닷물고기 살로, 살에 깊은 바다의 기운이 담겨 있어 신선함과 비린내가 모두 본연의 맛이다."],"10574":["굴",3,0,"바위에 단단히 붙어 자라며, 껍질은 거칠고 살은 부드럽다. 예광도 수역에서 낚시로 얻을 수 있다."],"10575":["고등어",3,0,"은청색 유선형 몸매에 등에는 날카로운 가시가 숨겨져 있다. 해도 수역에서 낚시로 얻을 수 있다."],"10576":["맛조개",3,0,"도끼발로 모래를 파고들며, 껍질은 비단처럼 얇고, 옥기둥 같은 살에 신선함이 숨겨져 있다. 유선촌 수역에서 낚시로 얻을 수 있다."],"10577":["갯가재",3,0,"마디 갑옷이 겹겹이 쌓여 있고, 몸은 푸르고 투명하다. 해도 수역에서 낚시로 얻을 수 있다."],"10578":["고등어",3,0,"푸른 무늬에 은빛 배, 등에는 지방선이 관통한다. 예광도 수역에서 낚시로 얻을 수 있다."],"10579":["갈치",3,0,"몸이 띠처럼 길고, 은빛 비늘이 갑옷 같으며, 살이 단단하고 가시가 적다. 유선촌 수역에서 낚시로 얻을 수 있다."],"10580":["바다농어",3,0,"몸은 옆으로 납작하고 길며, 등은 푸르고 배는 희며, 쪄서 먹으면 본연의 신선한 기운이 응축된다. 해도 수역에서 낚시로 얻을 수 있다."],"10581":["대구",3,0,"백옥이 굳어 몸을 이루었고, 살은 부드럽고 뼈가 없어 옥고보다 낫다. 해도 수역에서 낚시로 얻을 수 있다."],"10582":["낙지",3,0,"촉수에 빨판이 빽빽하게 붙어 있어 산 채로 잡으려면 교묘한 힘이 필요하며, 먹으면 쫄깃하고 탄력 있어 이에 달라붙는다. 유선촌 수역에서 낚시로 얻을 수 있다."],"10583":["가다랑어",3,0,"붉은 근육이 쇠와 같고, 살결이 치밀하며, 진한 신선함이 저절로 생긴다. 예광도 수역에서 낚시로 얻을 수 있다."],"10584":["오징어",3,0,"뼈는 부드럽고 형태는 북과 같으며, 촉수는 민첩하고, 빨판이 별처럼 흩어져 있다. 예광도 수역에서 낚시로 얻을 수 있다."],"10585":["돌돔",3,0,"호랑이 무늬에 넓은 입, 비늘 갑옷이 두껍고, 살은 양의 기름 같아 맑고 신선함이 하늘이 내린 것이라 할 수 있다. 해도 수역에서 낚시로 얻을 수 있다."],"10586":["바다장어",3,0,"몸이 뱀처럼 길고, 몸은 점액으로 덮여 있으며, 살이 두껍고 가시가 적어 보양식 중 으뜸이다. 예광도 수역에서 낚시로 얻을 수 있다."],"10587":["넙치",3,0,"두 눈이 같은 쪽에 있고, 가시가 적고 살이 부드러우며, 눈처럼 흰 지방이 빽빽하여 비린내가 없다. 유선촌 수역에서 낚시로 얻을 수 있다."],"10588":["감성돔",3,0,"검은 갑옷에 금빛 비늘, 얼음 같은 살결이 투명하며, 암초 근처에서 떼를 지어 헤엄쳐 잡기 어렵다. 유선촌 수역에서 낚시로 얻을 수 있다."],"10589":["금선련",3,0,"성질이 차고 해독 작용이 있으며, 잎맥에 금실 무늬가 숨겨져 있다. 무명도에서 수확할 수 있다."],"10590":["익지",3,0,"비장을 따뜻하게 하고 위를 열어주며, 매운 향으로 정신을 깨우니, 의원들이 그 씨앗을 자주 취한다. 무명도에서 수확할 수 있다."],"10591":["혈갈",3,0,"붉은 옥처럼 굳어 있고, 은은하게 밀랍 빛이 나며, 살을 돋우고 상처를 아물게 하는 효과가 있다. 무명도에서 수확할 수 있다."],"10592":["우대력",3,0,"뿌리가 교룡이 서린 것처럼 굵고, 허한 것을 보하고 폐를 윤택하게 하며, 근육을 튼튼하게 하고 경락을 활성화시킨다. 무명도에서 수확할 수 있다."],"10593":["파극천",3,0,"뿌리는 등나무처럼 갈색이고, 자색 무늬가 둘러싸고 있으며, 오래 복용하면 허화가 뜨는 것을 막아야 한다. 무명도에서 수확할 수 있다."],"106":["청허주",1,0,"이 액은 맑은 향이 멀리 퍼져 신에게 바치는 경우가 많으며, 향기가 구천에 통하여 청허라 불린다. 사용 후 진기를 회복한다."],"1060":["담로검",2,0,"구야자가 그의 정교한 기술을 가지고 담로산으로 가서, 그 산기슭의 가장 빼어나고 절경인 곳에 화로를 설치하여 3년 만에 검을 완성했다. 검이 완성되자 정교한 빛이"],"1061":["무진검",2,0,"그 검은 매미 날개처럼 얇고, 모양은 차가운 얼음과 같아, 오고 가며 틈이 있는 곳에서 나와 틈이 없는 곳으로 들어가며, 검신에는 먼지 하나 묻지 않아 무진이라 "],"1062":["복숭아나무 작은 검",2,0,"복숭아나무로 만든 작은 검으로, 아이들의 장난감이다."],"1063":["문심검",2,0,"막문이 정식으로 입문할 때 청허가 선물한 검."],"1064":["용연검",2,0,"용연검은 그 모양을 보면 높은 산에 올라 깊은 연못을 바라보는 것 같아, 마치 교룡이 웅크리고 있어 헤아릴 수 없는 것 같아 용연이라 불린다.【강음풍 전용】"],"1065":["칠살환사검",2,0,"오선교의 진교지보로, 오랫동안 금지 구역에 보관되어 있으며, 이것을 가지면 만고천독을 막을 수 있다."],"1066":["참룡",2,0,"능파선       if (!isConfigDoc(doc)) return false;
      var prop = ensureProp(doc, "Score", function () { return intProp("Score", 0); });
      prop.val = clamp(score, 0, MAX_INT32);
      markDirty();
      return true;
    }

    function toggleInherit(inheritId, enabled) {
      var doc = requireDoc();
      if (!isConfigDoc(doc)) return false;
      var id = toInt(inheritId);
      if (id < 1 || id > 9) return false;
      var prop = ensureProp(doc, "InheritIds", function () { return setPropInt("InheritIds", []); });
      var values = Array.isArray(prop.val) ? prop.val.map(toInt) : [];
      var idx = values.indexOf(id);
      if (enabled) {
        if (idx < 0) values.push(id);
      } else if (idx >= 0) {
        values.splice(idx, 1);
      }
      prop.val = values;
      markDirty();
      return true;
    }

    function unlockAllInherits() {
      var doc = requireDoc();
      if (!isConfigDoc(doc)) return false;
      var prop = ensureProp(doc, "InheritIds", function () { return setPropInt("InheritIds", []); });
      var existing = Array.isArray(prop.val) ? prop.val.map(toInt) : [];
      var values = [1, 2, 3, 4, 5];
      if (existing.indexOf(6) >= 0) values.push(6);
      values.push(7, 8, 9);
      prop.val = values.filter(function (value, index, arr) {
        return arr.indexOf(value) === index;
      });
      markDirty();
      return true;
    }

    function applyPreset(presetId) {
      var preset = PRESET_MAP[presetId];
      if (!preset) return false;
      var doc = requireDoc();
      if (preset.target === "config" && !isConfigDoc(doc)) return false;
      if (preset.target === "slot" && isConfigDoc(doc)) return false;
      if (presetId === "wealth_max") {
        setMoney(9999999);
        var wealthHero = findNpc(doc, 0);
        if (wealthHero) {
          wealthHero.skillExp = Math.max(toInt(wealthHero.skillExp), 999999);
          wealthHero.jingMaiPoint = Math.max(toInt(wealthHero.jingMaiPoint), 99999);
        }
        markDirty();
        return true;
      }
      if (presetId === "hero_cultivation") {
        var hero = findNpc(doc, 0);
        if (!hero) return false;
        var targets = { 1: 9999, 2: 9999, 3: 9999, 4: 9999, 6: 500, 7: 500, 8: 500, 9: 1500, 11: 1500, 42: 2000, 44: 999, 45: 999 };
        Object.keys(targets).forEach(function (key) {
          var id = toInt(key);
          var entry = ensureAttr(hero, id);
          setAttrEntry(entry, Math.max(attrValue(entry), targets[id]));
        });
        hero.addNeiGongLimit = Math.max(toInt(hero.addNeiGongLimit), 9999);
        markDirty();
        return true;
      }
      if (presetId === "party_favor_max") {
        var teamIds = (propVal(doc, "TeamInfos", []) || []).map(toInt);
        for (var i = 0; i < teamIds.length; i += 1) {
          if (teamIds[i] !== 0) setCompanionFavor(teamIds[i], 0, MAX_FAVOR);
          for (var j = 0; j < teamIds.length; j += 1) {
            if (teamIds[i] !== teamIds[j]) setCompanionFavor(teamIds[i], teamIds[j], MAX_FAVOR);
          }
        }
        return true;
      }
      if (presetId === "skills_lv10") {
        var skillTeamIds = (propVal(doc, "TeamInfos", []) || []).map(toInt);
        var ids = [0].concat(skillTeamIds);
        ids.forEach(function (id) {
          var npc = findNpc(doc, id);
          if (!npc) return;
          (Array.isArray(npc.skills) ? npc.skills : []).forEach(function (skill) {
            skill.level = MAX_SKILL_LEVEL;
          });
        });
        markDirty();
        return true;
      }
      if (presetId === "unlock_mounts_recipes") {
        unlockAllMounts();
        unlockAllRecipes();
        return true;
      }
      if (presetId === "reset_pill_limits") {
        return resetPillLimits();
      }
      if (presetId === "config_score_max") {
        setConfigScore(99999);
        unlockAllInherits();
        return true;
      }
      return false;
    }

    var PROP_LABELS_KO = {
      Money: "보유 금전",
      MapName: "현재 지역",
      MapCode: "지역 코드",
      SaveGameTime: "플레이 시간",
      TurnMode: "전투 방식",
      SelectedMountId: "장착 탈것",
      MountIds: "탈것 목록",
      TeamInfos: "파티 편성",
      FightTeamInfos: "전투 대열",
      Quests: "임무 기록",
      JHGatherSpecs: "채집 정보",
      WorldWalkNPCInfos: "강호 행인 정보",
      MonsterNPCInfos: "적대 세력 정보",
      AlchemyRecipes: "연단 도안",
      CookRecipes: "요리 도안",
      CookingRecipes: "요리 도안",
      ForgeRecipes: "단조 도안",
      FusionRecipes: "단조 도안",
      CanTransMapIds: "이동 가능 거점",
      CurrentTrackingQuestId: "추적 중인 임무",
      CurrentTrackingPrimeQuestId: "추적 중인 주요 임무",
      Score: "전승 점수",
      InheritIds: "전승 특전",
      PictorialBookIds: "인물 도감",
      SkillIds: "무공 도감",
      ItemIds: "물품 도감",
      EnterTeamNPCIDs: "동료 영입 도감",
      EndingIds: "결말 도감"
    };

    function validate() {
      var errors = [];
      var warnings = [];
      var doc = state.doc;
      if (!doc) {
        return { valid: false, errors: ["세이브 데이터가 로드되지 않았습니다."], warnings: [] };
      }
      if (doc.magic !== "GVAS") errors.push("세이브 헤더 식별값이 올바르지 않습니다.");
      if (toInt(doc.saveVersion) < 1 || toInt(doc.saveVersion) > 30) errors.push("세이브 버전이 올바르지 않습니다.");
      if (!doc.className || (doc.className.str !== SLOT_CLASS && doc.className.str !== CONFIG_CLASS)) {
        errors.push("세이브 클래스 이름이 올바르지 않습니다.");
      }
      if (!Array.isArray(doc.props)) {
        errors.push("속성 목록이 배열이 아닙니다.");
      } else if (!doc.props.some(function (p) { return p && p.name === "None"; })) {
        errors.push("속성 목록 끝에 종료 항목이 없습니다.");
      }
      var seen = {};
      (Array.isArray(doc.props) ? doc.props : []).forEach(function (prop, idx) {
        if (!prop || !prop.name || prop.name === "None") return;
        var propLabel = PROP_LABELS_KO[prop.name] || ("내부 속성 #" + (idx + 1));
        if (seen[prop.name]) warnings.push("중복 속성이 있습니다: " + propLabel);
        seen[prop.name] = true;
        if (prop.val === undefined && prop.entries === undefined && prop.opaque === undefined && prop.items === undefined) {
          warnings.push("속성 값이 비어 있습니다: " + propLabel);
        }
      });
      var npcs = Array.isArray(doc.npcs) ? doc.npcs : [];
      var npcIds = {};
      npcs.forEach(function (npc) {
        var id = toInt(npc.npcId);
        if (npcIds[id]) warnings.push("중복 인물 번호가 있습니다: " + id);
        npcIds[id] = true;
        if (!Array.isArray(npc.attrs)) warnings.push("인물 " + id + "의 능력치 배열이 없습니다.");
        (Array.isArray(npc.attrs) ? npc.attrs : []).forEach(function (a) {
          if (!a || a.id < 1 || a.id > 69) warnings.push("인물 " + id + "에 잘못된 능력치 번호가 있습니다.");
        });
        (Array.isArray(npc.friendliness) ? npc.friendliness : []).forEach(function (f) {
          if (toInt(f.favor) < 0 || toInt(f.favor) > 255) {
            errors.push("인물 " + id + "의 호감도가 범위를 벗어났습니다.");
          }
        });
        (Array.isArray(npc.skills) ? npc.skills : []).forEach(function (s) {
          if (toInt(s.level) < 0 || toInt(s.level) > 20) {
            errors.push("인물 " + id + "의 무공 레벨이 범위를 벗어났습니다.");
          }
        });
      });
      if (!isConfigDoc(doc)) {
        var turn = String(propVal(doc, "TurnMode", ""));
        if (turn && turn !== "ETurnMode::RealTime" && turn !== "ETurnMode::TurnBased") {
          warnings.push("턴 모드 값이 알 수 없는 형식입니다.");
        }
        (Array.isArray(doc.items) ? doc.items : []).forEach(function (item) {
          if (toInt(item.count) < 1 || toInt(item.count) > MAX_INT32) {
            errors.push("가방 아이템 수량이 범위를 벗어났습니다.");
          }
          if (!item.guid || item.guid.length !== 4 || toInt(item.guid[0]) === 0) {
            warnings.push("가방 아이템 고유 번호가 올바르지 않습니다.");
          }
        });
      }
      return { valid: errors.length === 0, errors: errors, warnings: warnings };
    }

    var session = {
      loadBytes: loadBytes,
      loadBytesSync: loadBytesSync,
      loadDoc: loadDoc,
      exportBytes: exportBytes,
      exportBytesSync: exportBytesSync,
      isLoaded: isLoaded,
      isConfigSave: isConfigSave,
      isDirty: isDirty,
      markClean: markClean,
      getDoc: getDoc,
      getMeta: getMeta,
      getSummary: getSummary,
      listEditableCharacters: listEditableCharacters,
      getCharacterDetail: getCharacterDetail,
      setMoney: setMoney,
      setTurnMode: setTurnMode,
      setSelectedMount: setSelectedMount,
      unlockAllMounts: unlockAllMounts,
      unlockAllRecipes: unlockAllRecipes,
      setNpcResources: setNpcResources,
      setNpcAttr: setNpcAttr,
      setCompanionFavor: setCompanionFavor,
      setGuildFavor: setGuildFavor,
      setGuildHonor: setGuildHonor,
      setSkillLevel: setSkillLevel,
      addSkill: addSkill,
      removeSkill: removeSkill,
      unlockAllMeridians: unlockAllMeridians,
      resetPillLimits: resetPillLimits,
      listBagItems: listBagItems,
      setBagItemCount: setBagItemCount,
      addBagItem: addBagItem,
      removeBagItem: removeBagItem,
      listAddableItems: listAddableItems,
      listAddableSkills: listAddableSkills,
      setConfigScore: setConfigScore,
      toggleInherit: toggleInherit,
      unlockAllInherits: unlockAllInherits,
      applyPreset: applyPreset,
      validate: validate
    };
    return session;
  }

  return {
    PRESETS: PRESETS,
    SLOT_CLASS: SLOT_CLASS,
    CONFIG_CLASS: SLOT_CLASS === CONFIG_CLASS ? "" : CONFIG_CLASS,
    formatPlayTime: formatPlayTime,
    makeSession: makeSession,
    createSession: makeSession,
    createDemoDoc: createDemoDoc,
    createDemoConfigDoc: createDemoConfigDoc,
    createDemoSavBytesSync: createDemoSavBytesSync,
    createDemoSavBytes: createDemoSavBytes,
    createDemoConfigSavBytesSync: createDemoConfigSavBytesSync,
    createDemoConfigSavBytes: createDemoConfigSavBytes
  };
}));

</script>
<script>
(function () {
  "use strict";

  var Core = window.WanderingSwordEditorCore;
  var Codec = window.WanderingSwordCodec;
  var Catalog = window.WanderingSwordCatalog;
  var session = Core.createSession(Codec, Catalog);

  var uiState = {
    busy: false,
    fileName: "0.sav",
    activeTab: "tab-overview",
    selectedNpcId: 0,
    attrGroupFilter: "전체",
    bagQuery: "",
    loopbackAvailable: false,
    loopbackToken: "",
    loopbackSha256: "",
    nativeAvailable: false,
    nativeSession: null,
    nativePath: null,
    pickerMode: null,
    pickerSelectedId: null
  };

  var nativeSeq = 0;
  var nativePending = new Map();
  var pickerResolve = null;
  var confirmResolve = null;
  var dialogsBound = false;
  var tabsBound = false;

  function el(id) {
    return document.getElementById(id);
  }

  function escHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function uint8ToBase64(bytes) {
    var view = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    var chunkSize = 0x8000;
    var parts = [];
    for (var i = 0; i < view.length; i += chunkSize) {
      var part = view.subarray(i, Math.min(i + chunkSize, view.length));
      var text = "";
      for (var j = 0; j < part.length; j += 1) text += String.fromCharCode(part[j]);
      parts.push(text);
    }
    return btoa(parts.join(""));
  }

  function base64ToUint8(b64) {
    var binary = atob(String(b64 || ""));
    var out = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) out[i] = binary.charCodeAt(i);
    return out;
  }

  function setStatus(msg, isError) {
    var banner = el("status-banner");
    if (!banner) return;
    banner.textContent = String(msg || "");
    banner.classList.toggle("is-error", !!isError);
    banner.setAttribute("role", isError ? "alert" : "status");
  }

  function setBusy(flag) {
    uiState.busy = !!flag;
    document.body.classList.toggle("is-busy", uiState.busy);
    var banner = el("status-banner");
    if (banner) banner.setAttribute("aria-busy", uiState.busy ? "true" : "false");
    syncTopBadges();
  }

  function syncTopBadges() {
    var loaded = session.isLoaded();
    var dirty = loaded && session.isDirty();
    var verdict = loaded ? session.validate() : { valid: false, errors: [] };
    var modeBadge = el("mode-badge");
    var dirtyBadge = el("dirty-badge");
    var validBadge = el("valid-badge");
    if (modeBadge) {
      modeBadge.textContent = uiState.nativeAvailable
        ? "데스크톱 앱 모드"
        : uiState.loopbackAvailable
          ? "로컬 서버 모드"
          : "오프라인 브라우저 모드";
    }
    if (dirtyBadge) {
      dirtyBadge.textContent = loaded ? (dirty ? "수정됨 (미저장)" : "변경 없음") : "비어 있음";
      dirtyBadge.classList.toggle("is-dirty", !!dirty);
    }
    if (validBadge) {
      validBadge.textContent = !loaded ? "검증 대기" : verdict.valid ? "검증 통과" : "검증 오류 " + verdict.errors.length + "건";
      validBadge.classList.toggle("is-error", loaded && !verdict.valid);
    }
  }

  function loadSessionBytes(bytes, fileName) {
    var name = fileName || uiState.fileName || "0.sav";
    return session.loadBytes(bytes, { filename: name }).then(function () {
      uiState.fileName = name;
      uiState.selectedNpcId = 0;
      renderAll();
    });
  }

  function exportSessionBytes() {
    return session.exportBytes();
  }

  function downloadBlob(bytes, fileName) {
    var blob = new Blob([bytes], { type: "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName || "0.sav";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function initThemeToggle() {
    var select = el("theme-select");
    if (!select) return;
    var saved = null;
    try { saved = localStorage.getItem("ws-theme"); } catch (err) { saved = null; }
    var initial = saved === "light" || saved === "dark" ? saved : "system";
    select.value = initial;

    function applyTheme(mode) {
      var meta = document.querySelector('meta[name="color-scheme"]');
      var content = mode === "light" ? "light" : mode === "dark" ? "dark" : "light dark";
      if (meta) meta.setAttribute("content", content);
      document.documentElement.setAttribute("data-theme", mode === "system" ? "자동" : mode === "dark" ? "어두움" : "밝음");
    }

    function persistTheme(mode) {
      try {
        if (mode === "system") {
          localStorage.removeItem("ws-theme");
          return;
        }
        var osDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if ((mode === "dark") === osDark) localStorage.removeItem("ws-theme");
        else localStorage.setItem("ws-theme", mode);
      } catch (err) {
        /* 저장소 접근이 제한된 환경에서도 현재 화면 테마는 즉시 반영합니다. */
      }
    }

    applyTheme(initial);
    select.addEventListener("change", function () {
      var mode = select.value;
      if (mode !== "light" && mode !== "dark") mode = "system";
      persistTheme(mode);
      applyTheme(mode);
      setStatus("화면 테마를 변경했습니다.", false);
    });

    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onChange = function () {
        if (select.value === "system") applyTheme("system");
      };
      if (typeof mq.addEventListener === "function") mq.addEventListener("change", onChange);
      else if (typeof mq.addListener === "function") mq.addListener(onChange);
    }
  }

  function activateTab(tabId, moveFocus) {
    var tab = el(tabId);
    if (!tab) return;
    var panelId = tab.getAttribute("aria-controls") || ("panel-" + tabId.replace(/^tab-/, ""));
    document.querySelectorAll('[role="tab"]').forEach(function (node) {
      var selected = node.id === tabId;
      node.setAttribute("aria-selected", selected ? "true" : "false");
      node.tabIndex = selected ? 0 : -1;
    });
    document.querySelectorAll('[role="tabpanel"]').forEach(function (panel) {
      if (panel.id === panelId) panel.removeAttribute("hidden");
      else panel.setAttribute("hidden", "until-found");
    });
    uiState.activeTab = tabId;
    if (moveFocus) tab.focus();
  }

  function initTabs() {
    if (tabsBound) return;
    tabsBound = true;
    document.querySelectorAll('[role="tablist"]').forEach(function (tablist) {
      tablist.addEventListener("keydown", function (ev) {
        var tabs = Array.prototype.slice.call(tablist.querySelectorAll('[role="tab"]'));
        var current = tabs.indexOf(document.activeElement);
        if (current < 0) return;
        var next = current;
        if (ev.key === "ArrowRight") next = (current + 1) % tabs.length;
        else if (ev.key === "ArrowLeft") next = (current - 1 + tabs.length) % tabs.length;
        else if (ev.key === "Home") next = 0;
        else if (ev.key === "End") next = tabs.length - 1;
        else return;
        ev.preventDefault();
        activateTab(tabs[next].id, true);
      });
    });
    document.querySelectorAll('[role="tab"]').forEach(function (tab) {
      tab.addEventListener("click", function () { activateTab(tab.id, false); });
    });
    document.querySelectorAll('[role="tabpanel"]').forEach(function (panel) {
      panel.addEventListener("beforematch", function () {
        var tab = document.querySelector('[role="tab"][aria-controls="' + panel.id + '"]') ||
          document.getElementById("tab-" + panel.id.replace(/^panel-/, ""));
        if (tab) activateTab(tab.id, false);
      });
    });
    var active = document.querySelector('[role="tab"][aria-selected="true"]') || document.querySelector('[role="tab"]');
    if (active) activateTab(active.id, false);
  }

  function ensureDialogInfrastructure() {
    if (dialogsBound) return;
    dialogsBound = true;

    var confirmDialog = el("confirm-dialog");
    if (confirmDialog) {
      confirmDialog.addEventListener("close", function () {
        var ok = confirmDialog.returnValue === "ok";
        confirmDialog.returnValue = "";
        if (confirmResolve) {
          var done = confirmResolve;
          confirmResolve = null;
          done(ok);
        }
      });
      confirmDialog.addEventListener("click", function (ev) {
        if (ev.target === confirmDialog) confirmDialog.close("cancel");
      });
      var cancelBtn = el("confirm-cancel-btn");
      var okBtn = el("confirm-ok-btn");
      if (cancelBtn) cancelBtn.addEventListener("click", function () { confirmDialog.close("cancel"); });
      if (okBtn) okBtn.addEventListener("click", function () { confirmDialog.close("ok"); });
    }

    var pickerDialog = el("picker-dialog");
    if (pickerDialog) {
      pickerDialog.addEventListener("close", function () {
        var ok = pickerDialog.returnValue === "ok";
        var countVal = Math.max(1, Math.trunc(Number((el("picker-count-input") || {}).value) || 1));
        var result = ok && uiState.pickerSelectedId != null
          ? { id: uiState.pickerSelectedId, count: countVal }
          : null;
        pickerDialog.returnValue = "";
        uiState.pickerMode = null;
        if (pickerResolve) {
          var done = pickerResolve;
          pickerResolve = null;
          done(result);
        }
      });
      pickerDialog.addEventListener("click", function (ev) {
        if (ev.target === pickerDialog) pickerDialog.close("cancel");
      });
      var pickerSearch = el("picker-search-input");
      if (pickerSearch) {
        pickerSearch.addEventListener("input", function () {
          renderPickerItems(pickerSearch.value);
        });
      }
      var pickerList = el("picker-list");
      if (pickerList) {
        pickerList.addEventListener("click", function (ev) {
          var item = ev.target.closest("[data-picker-id]");
          if (!item) return;
          pickerList.querySelectorAll("[data-picker-id]").forEach(function (node) {
            node.classList.remove("is-selected");
            node.setAttribute("aria-selected", "false");
          });
          item.classList.add("is-selected");
          item.setAttribute("aria-selected", "true");
          uiState.pickerSelectedId = Number(item.getAttribute("data-picker-id"));
        });
      }
      var pickerCancel = el("picker-cancel-btn");
      var pickerAdd = el("picker-add-btn");
      if (pickerCancel) pickerCancel.addEventListener("click", function () { pickerDialog.close("cancel"); });
      if (pickerAdd) {
        pickerAdd.addEventListener("click", function () {
          if (uiState.pickerSelectedId == null) {
            setStatus("추가할 항목을 목록에서 먼저 선택하세요.", true);
            return;
          }
          pickerDialog.close("ok");
        });
      }
    }
  }

  function confirmModal(title, message) {
    return new Promise(function (resolve) {
      var dialog = el("confirm-dialog");
      if (!dialog) {
        resolve(false);
        return;
      }
      ensureDialogInfrastructure();
      var titleNode = el("confirm-dialog-title");
      var messageNode = el("confirm-dialog-message");
      if (titleNode) titleNode.textContent = title || "작업 확인";
      if (messageNode) messageNode.textContent = message || "";
      dialog.returnValue = "";
      confirmResolve = resolve;
      if (typeof dialog.showModal === "function") dialog.showModal();
      else resolve(!!window.confirm(message || title || ""));
    });
  }

  function renderPickerItems(query) {
    var list = el("picker-list");
    if (!list) return;
    var q = String(query || "").trim();
    var items = [];
    if (session.isLoaded()) {

  function sendNative(kind, extra) {
    if (!(window.chrome && window.chrome.webview)) {
      return Promise.reject(new Error("데스크톱 앱 연결을 사용할 수 없습니다."));
    }
    var id = "req-" + (++nativeSeq);
    return new Promise(function (resolve, reject) {
      nativePending.set(id, { resolve: resolve, reject: reject });
      var msg = { id: id, seq: nativeSeq, kind: kind };
      if (extra) {
        Object.keys(extra).forEach(function (k) { msg[k] = extra[k]; });
      }
      try {
        window.chrome.webview.postMessage(msg);
      } catch (err) {
        nativePending.delete(id);
        reject(err);
      }
    });
  }

  function applyNativeReply(reply) {
    if (reply && reply.base64) {
      uiState.nativeSession = reply.session || null;
      uiState.nativePath = reply.path || null;
      return loadSessionBytes(base64ToUint8(reply.base64), reply.fileName || reply.file || "0.sav").then(function () {
        setStatus("데스크톱 세이브를 불러왔습니다: " + uiState.fileName, false);
      });
    }
    if (reply && reply.demo) {
      return loadDemoSave();
    }
    return Promise.resolve();
  }

  function initNativeBridge() {
    if (!(window.chrome && window.chrome.webview)) {
      uiState.nativeAvailable = false;
      return;
    }
    uiState.nativeAvailable = true;
    var bar = el("native-bar");
    if (bar) bar.hidden = false;
    window.chrome.webview.addEventListener("message", function (ev) {
      var reply = ev && ev.data ? ev.data : {};
      if (typeof reply === "string") {
        try { reply = JSON.parse(reply); } catch (e) { reply = {}; }
      }
      var pending = reply.id ? nativePending.get(reply.id) : null;
      if (!pending) return;
      nativePending.delete(reply.id);
      if (reply.error) pending.reject(new Error(String(reply.error)));
      else pending.resolve(reply);
    });
    setBusy(true);
    sendNative("ready", {}).then(function (reply) {
      return applyNativeReply(reply);
    }).catch(function (err) {
      setStatus(err && err.message ? err.message : "데스크톱 초기화에 실패했습니다.", true);
    }).then(function () {
      setBusy(false);
    });
  }

  function bindRootEvents() {
    var browserOpen = el("btn-browser-open");
    var fileInput = el("file-input");
    var loadDemo = el("btn-load-demo");
    var browserDownload = el("btn-browser-download");
    var loopbackOpen = el("btn-loopback-open");
    var loopbackSave = el("btn-loopback-save");
    var nativeOpenBtn = el("btn-native-open");
    var nativeSaveBtn = el("btn-native-save");
    var nativeSaveCopyBtn = el("btn-native-save-copy");

    if (browserOpen && fileInput) {
      browserOpen.addEventListener("click", function () { fileInput.click(); });
    }
    if (fileInput) {
      fileInput.addEventListener("change", function () {
        var file = fileInput.files && fileInput.files[0];
        if (file) openBrowserFile(file);
        fileInput.value = "";
      });
    }
    if (loadDemo) loadDemo.addEventListener("click", loadDemoSave);
    if (browserDownload) browserDownload.addEventListener("click", downloadModifiedSave);
    if (loopbackOpen) loopbackOpen.addEventListener("click", openLoopbackSelected);
    if (loopbackSave) loopbackSave.addEventListener("click", saveLoopbackCurrent);
    if (nativeOpenBtn) nativeOpenBtn.addEventListener("click", nativeOpen);
    if (nativeSaveBtn) nativeSaveBtn.addEventListener("click", nativeSave);
    if (nativeSaveCopyBtn) nativeSaveCopyBtn.addEventListener("click", nativeSaveCopy);

    document.addEventListener("click", function (ev) {
      var target = ev.target.closest("[data-action]");
      if (!target) return;
      var action = target.getAttribute("data-action");
      if (action === "apply-preset") {
        var presetId = target.getAttribute("data-preset-id");
        confirmModal("빠른 프리셋 적용", "선택한 프리셋을 현재 세이브에 적용할까요?").then(function (ok) {
          if (ok && session.applyPreset(presetId)) {
            renderAll();
            setStatus("빠른 프리셋을 적용했습니다.", false);
          }
        });
      } else if (action === "reset-pill-limits") {
        confirmModal("복용 제한 초기화", "모든 인물의 영단·음식 복용 횟수 제한 기록을 초기화할까요?").then(function (ok) {
          if (ok && session.resetPillLimits()) {
            renderAll();
            setStatus("복용 횟수 제한 기록을 초기화했습니다.", false);
          }
        });
      } else if (action === "open-add-skill") {
        openPickerModal("skill").then(function (res) {
          if (res && res.id != null) {
            if (session.addSkill(uiState.selectedNpcId, res.id, res.count)) {
              renderAll();
              setStatus("선택한 무공을 습득 목록에 추가했습니다.", false);
            } else {
              setStatus("이미 습득한 무공이거나 추가할 수 없는 항목입니다.", true);
            }
          }
        });
      } else if (action === "remove-skill") {
        if (session.removeSkill(uiState.selectedNpcId, Number(target.getAttribute("data-skill-id")))) {
          renderAll();
          setStatus("습득 무공을 제거했습니다.", false);
        }
      } else if (action === "unlock-meridians") {
        if (session.unlockAllMeridians(uiState.selectedNpcId)) {
          renderAll();
          setStatus("경맥·혈도를 모두 개통하고 경맥 점수를 부여했습니다.", false);
        }
      } else if (action === "open-add-item") {
        openPickerModal("item").then(function (res) {
          if (res && res.id != null) {
            if (session.addBagItem(res.id, res.count)) {
              renderAll();
              setStatus("가방에 물품을 추가했습니다.", false);
            }
          }
        });
      } else if (action === "remove-bag-item") {
        if (session.removeBagItem(Number(target.getAttribute("data-bag-index")))) {
          renderAll();
          setStatus("가방에서 물품을 삭제했습니다.", false);
        }
      } else if (action === "unlock-all-mounts") {
        session.unlockAllMounts();
        renderAll();
        setStatus("탈것 10종을 모두 해금했습니다.", false);
      } else if (action === "unlock-all-recipes") {
        session.unlockAllRecipes();
        renderAll();
        setStatus("연단·요리·단조 도안을 모두 해금했습니다.", false);
      } else if (action === "unlock-all-inherits") {
        session.unlockAllInherits();
        renderAll();
        setStatus("추천 전승 특전을 모두 해금했습니다.", false);
      }
    });

    document.addEventListener("input", function (ev) {
      var target = ev.target.closest('[data-action="filter-bag"]');
      if (!target) return;
      uiState.bagQuery = target.value;
      var pos = target.selectionStart;
      renderBagPanel();
      var next = document.querySelector('[data-action="filter-bag"]');
      if (next) {
        next.focus();
        if (pos != null) next.setSelectionRange(pos, pos);
      }
    });

    document.addEventListener("change", function (ev) {
      var target = ev.target.closest("[data-action]");
      if (!target) return;
      var action = target.getAttribute("data-action");
      var changed = true;
      if (action === "select-npc") {
        uiState.selectedNpcId = Number(target.value) || 0;
        renderStatsPanel();
        renderMartialPanel();
        return;
      } else if (action === "filter-attr-group") {
        uiState.attrGroupFilter = target.value;
        renderStatsPanel();
        return;
      } else if (action === "set-money") {
        session.setMoney(Number(target.value));
      } else if (action === "set-turn-mode") {
        session.setTurnMode(target.value);
      } else if (action === "set-config-score") {
        session.setConfigScore(Number(target.value));
      } else if (action === "set-resource") {
        var field = target.getAttribute("data-field");
        var obj = {};
        obj[field] = Number(target.value);
        session.setNpcResources(uiState.selectedNpcId, obj);
      } else if (action === "set-attr") {
        session.setNpcAttr(uiState.selectedNpcId, Number(target.getAttribute("data-attr-id")), Number(target.value));
      } else if (action === "set-skill-level") {
        session.setSkillLevel(uiState.selectedNpcId, Number(target.getAttribute("data-skill-id")), Number(target.value));
      } else if (action === "set-bag-count") {
        session.setBagItemCount(Number(target.getAttribute("data-bag-index")), Number(target.value));
      } else if (action === "set-companion-favor") {
        session.setCompanionFavor(Number(target.getAttribute("data-npc-id")), Number(target.value));
      } else if (action === "set-guild-honor") {
        session.setGuildHonor(0, Number(target.getAttribute("data-guild-id")), Number(target.value));
      } else if (action === "set-mount") {
        session.setSelectedMount(Number(target.value));
        renderWorldPanel();
      } else if (action === "toggle-inherit") {
        session.toggleInherit(Number(target.getAttribute("data-inherit-id")), !!target.checked);
      } else {
        changed = false;
      }
      if (changed) {
        renderOverviewPanel();
        syncTopBadges();
      }
    });
  }

  window.hasUnsavedChanges = function () {
    return !!(session.isLoaded() && session.isDirty());
  };

  window.addEventListener("beforeunload", function (ev) {
    if (!window.hasUnsavedChanges()) return;
    ev.preventDefault();
    ev.returnValue = "저장하지 않은 변경 사항이 있습니다.";
    return ev.returnValue;
  });

  window.WanderingSwordEditorUI = {
    isBusy: function () { return uiState.busy; },
    getNativeSession: function () { return uiState.nativeSession; },
    getSession: function () { return session; },
    renderAll: function () { renderAll(); },
    applyPresetDirect: function (id) {
      if (session.applyPreset(id)) {
        renderAll();
        setStatus("빠른 프리셋을 적용했습니다.", false);
        return true;
      }
      return false;
    },
    exportBase64: function () {
      return exportSessionBytes().then(uint8ToBase64);
    }
  };

  function boot() {
    initThemeToggle();
    initTabs();
    ensureDialogInfrastructure();
    bindRootEvents();
    renderAll();
    initNativeBridge();
    if (!uiState.nativeAvailable) probeLoopback();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
